{{ define "main" }}
<article class="post-single">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">
            {{ .Date.Format "January 2, 2006" }}
            {{ if .Params.ReadingTime }}· {{ .ReadingTime }} min read{{ end }}
        </div>
        {{ with .Params.tags }}
        <div class="post-tags">
            {{ range . }}
            <span class="tag">{{ . }}</span>
            {{ end }}
        </div>
        {{ end }}
    </header>
    
    <div class="post-content">
        {{ .Content }}
    </div>

    <footer class="post-footer">
        <a href="/">← Back</a>
    </footer>
</article>
{{ end }}
