{{ $width := .Get "width" | default "80%" }}

<figure style="width: {{ $width }}; margin: 1.5rem auto; text-align: center;">
  <video autoplay loop muted playsinline loading="lazy"
         style="width: 100%; height: auto;">
    <source src="{{ .Get "src" }}" type="video/mp4">
  </video>
  {{ with .Get "caption" }}
  <figcaption style="margin-top: 8px; font-size: 0.9em; color: #666;">
    {{ . }}
  </figcaption>
  {{ end }}
</figure>
